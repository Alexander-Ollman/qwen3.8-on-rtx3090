# Dual-model front: routes by the request's "model" field instead of round-robin.
#   model contains "swift"  -> replica-gpu1 (Swift-Qwen3.8-27B, served as swift-qwen3.8-27b)
#   anything else           -> replica-gpu0 (base Qwen3.8-27B, served as qwen3.8-27b)
# Same port (18000), same log format and limits as qwen-lb.conf, so clients and the
# telemetry do not care which front is up. Used by launchers/dual.sh; the round-robin
# qwen-lb.conf stays the front for the single-model profiles.
load_module modules/ngx_http_js_module.so;
worker_processes 1;
error_log /var/log/qwen/lb-error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  js_import router.js;

  client_max_body_size 32m;
  log_format qwen escape=json
    '{"ts":"$time_iso8601","replica":"$upstream_addr","status":$status,'
    '"request_time":$request_time,"header_time":"$upstream_header_time",'
    '"upstream_time":"$upstream_response_time","bytes_out":$body_bytes_sent,'
    '"bytes_in":$request_length,"uri":"$uri","method":"$request_method",'
    '"route":"$proxy_host"}';
  access_log /var/log/qwen/requests.jsonl qwen;

  upstream base  { server replica-gpu0:18020 max_fails=3 fail_timeout=30s; keepalive 32; }
  upstream swift { server replica-gpu1:18021 max_fails=3 fail_timeout=30s; keepalive 32; }

  server {
    listen 18000;
    # The body must be fully in memory before router.route runs (it reads requestText).
    client_body_buffer_size 32m;
    location / {
      js_content router.route;
    }
    location ^~ /_base/ {
      internal;
      rewrite ^/_base(/.*)$ $1 break;
      proxy_pass http://base;
      proxy_http_version 1.1;
      proxy_buffering off;              # required for streaming
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      proxy_set_header Connection "";
    }
    location ^~ /_swift/ {
      internal;
      rewrite ^/_swift(/.*)$ $1 break;
      proxy_pass http://swift;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 7200s;         # a 32K-token thinking answer at llama.cpp speed is ~20 min
      proxy_send_timeout 7200s;
      proxy_set_header Connection "";
    }
    # /v1/models: merge both replicas' answers so clients see both ids.
    location = /v1/models {
      js_content router.models;
    }
    location = /lb-health { access_log off; return 200 "ok\n"; }
  }
}
